
spring.application.name=${SPRING_APPLICATION_NAME:skillhub}

# Datasource
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/skillhub}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:true}
spring.jpa.database-platform=${JPA_DATABASE_PLATFORM:org.hibernate.dialect.PostgreSQLDialect}

# JWT
security.jwt.secret=${JWT_SECRET}
security.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:15}
security.jwt.refresh-expiration-minutes=${JWT_REFRESH_EXPIRATION_MINUTES:60}
